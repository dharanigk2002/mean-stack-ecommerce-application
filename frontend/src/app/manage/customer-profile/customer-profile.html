<div class="min-h-screen bg-orange-50 px-4 py-10">
  <div class="mx-auto max-w-lg">
    <div
      class="overflow-hidden rounded-2xl border border-orange-100 bg-white shadow-lg shadow-orange-100/50"
    >
      <!-- Header -->
      <div class="bg-linear-to-r from-orange-500 to-orange-600 px-6 py-8 text-white">
        <div class="flex items-center gap-4">
          <div
            class="flex h-16 w-16 items-center justify-center rounded-full bg-white/20 ring-4 ring-white/30"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-9 w-9"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0A17.9 17.9 0 0 1 12 21.75c-2.7 0-5.25-.6-7.5-1.65Z"
              />
            </svg>
          </div>

          <div>
            <h1 class="text-2xl font-bold">My Profile</h1>
            <p class="mt-1 text-sm text-orange-100">Manage your account information</p>
          </div>
        </div>
      </div>

      <!-- Profile details -->
      <div class="space-y-5 p-6">
        <div>
          <label class="mb-2 block text-sm font-semibold text-orange-800"> Full Name </label>
          <div
            class="flex items-center gap-3 rounded-xl border border-orange-100 bg-orange-50/70 px-4 py-3"
          >
            <svg
              class="h-5 w-5 shrink-0 text-orange-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.1a7.5 7.5 0 0 1 15 0A17.9 17.9 0 0 1 12 21.75c-2.7 0-5.25-.6-7.5-1.65Z"
              />
            </svg>
            <p class="wrap-break-word font-medium text-gray-800">
              {{ user()?.name }}
            </p>
          </div>
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-orange-800"> Email Address </label>
          <div
            class="flex items-center gap-3 rounded-xl border border-orange-100 bg-orange-50/70 px-4 py-3"
          >
            <svg
              class="h-5 w-5 shrink-0 text-orange-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect width="18" height="14" x="3" y="5" rx="2" />
              <path stroke-linecap="round" stroke-linejoin="round" d="m3 7 9 6 9-6" />
            </svg>
            <p class="break-all font-medium text-gray-800">
              {{ user()?.email }}
            </p>
          </div>
        </div>

        <div
          class="flex items-center gap-2 rounded-xl bg-orange-100/70 px-4 py-3 text-sm text-orange-800"
        >
          <svg
            class="h-5 w-5 shrink-0 text-orange-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m9 12 2 2 4-4m5.6-3A12 12 0 0 1 12 3a12 12 0 0 1-8.6 4A12 12 0 0 0 12 21a12 12 0 0 0 8.6-14Z"
            />
          </svg>
          <span>Your account information</span>
        </div>
      </div>
    </div>
  </div>
</div>
