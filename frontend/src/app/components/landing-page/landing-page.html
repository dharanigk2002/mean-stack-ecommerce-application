<div class="p-8 space-y-5">
  <section>
    <h4 class="mb-6 text-2xl font-semibold text-gray-900">Featured Products</h4>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of featuredProduct(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </section>
  <section>
    <h4 class="mb-6 text-2xl font-semibold text-gray-900">New Products</h4>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of newProduct(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </section>
</div>
