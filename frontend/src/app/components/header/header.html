<header class="sticky top-0 z-50 bg-white shadow-sm" #header>
  <!-- First row -->
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-6 px-4">
    <!-- Logo -->
    <a routerLink="/" class="shrink-0 text-2xl font-bold tracking-tight text-gray-900">
      Shop<span class="text-orange-500">Ease</span>
    </a>

    <!-- Search -->
    <form
      class="flex h-10 flex-1 overflow-hidden rounded-lg border border-gray-300 transition focus-within:border-orange-500 focus-within:ring-1 focus-within:ring-orange-500"
      autocomplete="off"
      (ngSubmit)="onSearch($event)"
    >
      <input
        type="text"
        name="search"
        placeholder="Search for products, brands and more..."
        class="flex-1 px-4 text-sm outline-none"
      />

      <button
        type="submit"
        class="px-4 cursor-pointer bg-orange-500 text-white transition hover:bg-orange-600"
      >
        🔍
      </button>
    </form>

    <!-- Profile -->
    <div class="flex shrink-0 items-center gap-2 text-gray-700 transition">
      <a
        routerLink="profile"
        class="flex h-9 w-9 items-center justify-center rounded-full cursor-pointer bg-gray-100"
        >👤</a
      >

      <div class="hidden flex-col sm:flex">
        <span class="text-xs text-gray-500">Hello, {{ user?.name }}</span>
        <button
          type="button"
          class="text-sm font-semibold hover:text-orange-500 text-left cursor-pointer"
          (click)="onLogout()"
        >
          Logout
        </button>
      </div>
      @if (!user?.isAdmin) {
        <div class="flex items-center gap-2">
          <a routerLink="/wishlist">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="h-6 w-6 transition-colors duration-200 text-red-500"
              stroke="currentColor"
              fill="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733C11.285 4.876 9.623 3.75 7.688 3.75 5.099 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
              />
            </svg>
          </a>
          <a routerLink="/cart" class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              class="h-5 w-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"
              />
              <circle cx="10" cy="20" r="1" />
              <circle cx="18" cy="20" r="1" />
            </svg>
            <div
              class="absolute w-5 flex items-center justify-center aspect-square rounded-full -top-2.5 -right-2 bg-orange-500 text-xs text-white"
            >
              {{ quantity() }}
            </div>
          </a>
          <a routerLink="/orders" class="font-bold">Orders</a>
        </div>
      } @else {
        <a
          routerLink="/admin"
          class="bg-orange-500 mx-4 px-2 py-2 rounded-md text-gray-50 cursor-pointer hover:bg-orange-700 transition-colors"
        >
          Admin Dashboard &rarr;
        </a>
      }
    </div>
  </div>

  <!-- Second row - Categories -->
  <nav class="border-t border-gray-100">
    <div class="mx-auto flex h-12 max-w-7xl items-center gap-8 overflow-x-auto px-4 scrollbar-hide">
      @for (category of categories(); track category.id) {
        <a
          [routerLink]="['/products']"
          [queryParams]="{ 'category-id': category.id, page: null }"
          queryParamsHandling="merge"
          routerLinkActive="text-orange-500"
          #rla="routerLinkActive"
          class="group relative shrink-0 py-3 text-sm font-medium text-gray-600 transition hover:text-orange-500"
        >
          {{ category.name }}

          <!-- Hover underline -->
          <span
            class="absolute bottom-1 left-0 h-0.5 w-full origin-left scale-x-0 bg-orange-500 transition-transform duration-300 group-hover:scale-x-100"
            [class.scale-x-100]="rla.isActive"
          ></span>
        </a>
      }
    </div>
  </nav>
</header>
