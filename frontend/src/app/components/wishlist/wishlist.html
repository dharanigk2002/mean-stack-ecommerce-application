<section class="w-full max-w-7xl mx-auto my-5">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (wishlist of wishlistItems(); track wishlist.id) {
      <app-product-card [product]="wishlist" />
    } @empty {
      <h1 class="text-2xl text-center">No items in the wishlist</h1>
    }
  </div>
</section>
